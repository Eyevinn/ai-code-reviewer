name: Unit Tests
on: [push]

permissions:
  contents: read

jobs:
  unittests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
          cache: npm
      - name: Install Dependencies
        run: npm ci
        env:
          HUSKY: 0
      - name: Run Unit Tests
        run: npm test
