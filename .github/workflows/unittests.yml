name: Unit Tests
on: [push]

permissions:
  contents: read

jobs:
  unittests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
          cache: npm
      - name: Install Dependencies
        run: npm ci
        env:
          HUSKY: 0
      - name: Run Unit Tests
        run: npm test
